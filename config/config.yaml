# Modo de funcionamiento: "keyword_once" o "keyword_until_stop"
mode: "keyword_once"

# Palabras clave (se comparan en minúsculas)
activation_word: "activar"
stop_word: "parar"
mic_off_word: "silencio"

# Silencio razonable (solo aplica a mode=keyword_once)
silence_timeout_sec: 0.8 # tiempo continuo por debajo del umbral para cortar
silence_energy_threshold: 650 # umbral de energía RMS (int16). Ajustar según mic/entorno

# Audio / Vosk
sample_rate: 16000
model_path: "src/models/es" # carpeta del modelo Vosk descargado

# Calibración automática del umbral de silencio
auto_calibrate_silence: true
calib_seconds: 1.5
calib_factor: 1.6
calib_min_thresh: 120

# (Opcional) listar dispositivos al arrancar
list_devices: false

# (Opcional) seleccionar dispositivo de entrada concreto
# audio_device_index: 3

# Persona
person_name: "Gorka"

# Plugins habilitados (coinciden con nombres de archivo en plugins/ sin .py)
plugins:
    - "saludo"
    - "volumen"
    - "sistema"
    - "pantalla"
    - "modos"

hotkeys:
  mic_off: "ctrl+shift+m"
  mic_on: "ctrl+shift+n"
