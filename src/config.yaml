# Modo de funcionamiento: "keyword_once" o "keyword_until_stop"
mode: "keyword_once"

# Palabras clave (se comparan en minúsculas)
activation_word: "activar"
stop_word: "parar"

# Silencio razonable (solo aplica a mode=keyword_once)
silence_timeout_sec: 1.2 # tiempo continuo por debajo del umbral para cortar
silence_energy_threshold: 650 # umbral de energía RMS (int16). Ajustar según mic/entorno

# Audio / Vosk
sample_rate: 16000
model_path: "src/models/es" # carpeta del modelo Vosk descargado

# Persona
person_name: "Gorka"

# Plugins habilitados (coinciden con nombres de archivo en plugins/ sin .py)
plugins:
    - "saludo"
    - "volumen"
